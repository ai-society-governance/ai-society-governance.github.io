<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
  
<body>

  <header class="site-header">
    <div class="container">

      <a class="site-title" href="{{ '/' | relative_url }}">
        AI│SG
      </a>

      <nav class="site-nav">
  <a href="{{ '/' | relative_url }}"
     {% if page.url == "/" %}class="active"{% endif %}>
    Overview
  </a>

  <a href="{{ '/program/' | relative_url }}"
     {% if page.url == "/program/" %}class="active"{% endif %}>
    Program
  </a>

  <a href="{{ '/venue/' | relative_url }}"
     {% if page.url == "/venue/" %}class="active"{% endif %}>
    Venue
  </a>
</nav>
      
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

<footer class="site-footer">
  <div class="container">
    © 2027 AI│SG · Centre for Economics at Paris-Saclay
  </div>
</footer>
  
</body>
</html>
